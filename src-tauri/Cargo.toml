[package]
name = "chrome-host"
version = "0.1.5"
description = "Browser Runtime Manager for Humans and AI Agents"
edition = "2021"

# GUI 的 cargo 产物名用 -app 后缀：workspace 下 CLI crate（crates/cli）已占用
# `chrome-host` 作为 PRD §26 规定的产品入口命令名，同名 bin 会 output collision
# 互相覆盖（P5 计划 §2.2）。包名保持 chrome-host 不变（tauri 配置/identifier 无感知）；
# 打包后的用户可见名也不变（.app 名来自 productName）。
# mainBinaryName 在 tauri.conf.json 同步为 chrome-host-app。
autobins = false

[[bin]]
name = "chrome-host-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
r2d2 = "0.8"
r2d2_sqlite = "0.25"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
socket2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
rmcp = { version = "3.3.0", features = ["server", "transport-streamable-http-server"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
walkdir = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

# 平台限定：进程组/探活（unix）
[target.'cfg(unix)'.dependencies]
libc = "0.2"
