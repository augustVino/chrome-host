[workspace]
members = ["src-tauri", "crates/cli"]
resolver = "2"

# 工作区级 release 配置：与 src-tauri 原有 [profile.release] 保持一致。
# workspace 下只有根清单的 profile 生效；src-tauri 内的副本暂留（本任务不动
# src-tauri，后续任务应删除成员内副本以消除 cargo 的 "profiles ignored" 警告）。
[profile.release]
strip = true
lto = true

# vendored tauri-build：上游 2.6.3 copy_binaries 对已存在 sidecar 目标
# remove_file().unwrap() 在部分 CI 环境 EPERM panic（详见 vendor/tauri-build/src/lib.rs 内注）。
# 版本与上游锁定一致（2.6.3），升级 tauri 时需同步重打此补丁。
[patch.crates-io]
tauri-build = { path = "vendor/tauri-build" }
