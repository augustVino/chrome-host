name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 单 job 先行创建 Release（矩阵内各平台向同一 releaseId 上传产物）
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %h %s" "${PREV_TAG}..HEAD")
          else
            CHANGELOG=$(git log --pretty=format:"- %h %s" -n 20)
          fi

          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            -X POST \
            -f tag_name="$TAG" \
            -f name="chrome-host ${TAG}" \
            -f body="$(cat <<BODY
          ## 📦 下载

          | 平台 | 文件 |
          |------|------|
          | macOS (Apple Silicon) | \`.dmg\` |
          | macOS (Intel) | \`.dmg\` |
          | Linux (deb 系) | \`.deb\` / \`.AppImage\` |
          | Windows | \`-setup.exe\`（NSIS） |
          | Skills 技能包 | \`skills.zip\` |

          > macOS 安装后应用无法打开？（未做 Apple 公证，解除 Gatekeeper 拦截）
          \`\`\`bash
          xattr -cr /Applications/chrome-host.app
          \`\`\`

          ---

          ## 📝 更新日志

          ${CHANGELOG}
          BODY
          )" --jq '.id')

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release created: id=$RELEASE_ID"

      # skills/ 目录打包随 release 发布（ubuntu 自带 zip；在单 job 做一次，避免矩阵重复上传）
      - name: Package and upload skills bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d skills ]; then
            echo "::error::skills/ 目录不存在，请确认已提交到仓库"
            exit 1
          fi
          zip -r skills.zip skills -x '*.DS_Store' '*__MACOSX*'
          gh release upload "${GITHUB_REF_NAME}" skills.zip --clobber
          echo "skills.zip uploaded ($(du -h skills.zip | cut -f1))"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # darwin-aarch64
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Intel 包在 arm runner 上交叉编译：macos-13 免费档排队严重（首次跑排队 45min+），
          # macOS→macOS 同系交叉为 Tauri 官方支持路径（PRD v2 §1.2 备选）
          - os: macos-latest # darwin-x86_64
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04 # linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - os: windows-latest # windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> ./target
          key: ${{ matrix.rust_target }}

      # pnpm 版本取 package.json 的 packageManager 字段（与 docs.yml 一致，勿再写 version 输入）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Linux 托盘依赖（AppIndicator 等，PRD v2 §1.3）
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install

      # 版本号从 tag 同步三处（node 跨平台，规避 GNU/BSD sed 差异）
      - name: Update version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating version to $VERSION"
          node -e "
            const fs = require('fs');
            for (const f of ['src-tauri/tauri.conf.json', 'package.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
            let toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            toml = toml.replace(/^version = \".*\"/m, 'version = \"$VERSION\"');
            fs.writeFileSync('src-tauri/Cargo.toml', toml);
          "

      # 签名私钥多格式兼容解析（原文两行 / base64 包裹 / 单行 key body），随后导出给 tauri-action
      - name: Prepare Tauri signing key
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty or missing"
            exit 1
          fi

          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"

          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "Using raw two-line key format"
          elif DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
            && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$DECODED" > "$KEY_PATH"
            echo "Decoded base64-wrapped key"
          elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            printf '%s\n%s\n' "untrusted comment: tauri signing key" "$(echo "$RAW" | tr -d '\r\n')" > "$KEY_PATH"
            echo "Using single-line base64 key, constructed two-line file"
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY format not recognized"
            exit 1
          fi

          KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"

          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # 末尾校验：latest.json 必须含四平台键（PRD v2 §1.5 DoD-5，缺键告警失败）
  verify-latest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest.json has all four platform keys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # 免 checkout：gh 从环境变量取 repo，否则报 not a git repository
        run: |
          gh release download "${GITHUB_REF_NAME}" -p "latest.json" -O latest.json
          cat latest.json
          node -e "
            const latest = require('./latest.json');
            const required = ['darwin-aarch64', 'darwin-x86_64', 'linux-x86_64', 'windows-x86_64'];
            const missing = required.filter((k) => !latest.platforms?.[k]?.signature || !latest.platforms?.[k]?.url);
            if (missing.length) {
              console.error('::error::latest.json 缺少平台键或签名无效: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('✓ latest.json 四平台键齐全');
          "
