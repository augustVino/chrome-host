<svg viewBox="0 0 1240 1050" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'SF Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1240" height="1050" fill="#0f172a"/>
  <rect width="1240" height="1050" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="42" fill="white" font-size="17" font-weight="700">chrome-host 架构 —— 一个服务层，三个门面</text>
  <text x="40" y="62" fill="#94a3b8" font-size="10">Agent API（REST）是共享服务层的 HTTP 视图；MCP 与 CLI 是同一层的另外两种协议视图</text>

  <!-- ══════════ Region A：客户端 / 外部进程 ══════════ -->
  <rect x="40" y="84" width="760" height="144" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="56" y="104" fill="#fbbf24" font-size="9" font-weight="600">客户端 / 外部进程</text>

  <!-- CLI 门面 -->
  <rect x="76" y="122" width="320" height="78" rx="6" fill="#0f172a"/>
  <rect x="76" y="122" width="320" height="78" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="236" y="146" fill="white" font-size="11" font-weight="600" text-anchor="middle">chrome-host CLI（独立进程）</text>
  <text x="236" y="163" fill="#94a3b8" font-size="9" text-anchor="middle">crates/cli · 薄客户端</text>
  <text x="236" y="179" fill="#94a3b8" font-size="8" text-anchor="middle">参数解析 → HTTP → 渲染 → exit code</text>

  <!-- MCP 客户端 -->
  <rect x="440" y="122" width="320" height="78" rx="6" fill="#0f172a"/>
  <rect x="440" y="122" width="320" height="78" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="146" fill="white" font-size="11" font-weight="600" text-anchor="middle">AI Agent（MCP 客户端）</text>
  <text x="600" y="163" fill="#94a3b8" font-size="9" text-anchor="middle">Claude · Cursor · 任意 MCP Host</text>
  <text x="600" y="179" fill="#94a3b8" font-size="8" text-anchor="middle">工具发现 · 多轮编排</text>

  <!-- ══════════ Region B：chrome-host 桌面应用进程 ══════════ -->
  <rect x="40" y="252" width="1160" height="496" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="12,4"/>
  <text x="56" y="270" fill="#60a5fa" font-size="9" font-weight="600">chrome-host 桌面应用进程（Tauri v2 · axum 127.0.0.1:17890）</text>

  <!-- axum HTTP 服务（HTTP 视图，本图主角） -->
  <rect x="90" y="286" width="740" height="110" rx="8" fill="#0f172a"/>
  <rect x="90" y="286" width="740" height="110" rx="8" fill="rgba(59,130,246,0.18)" stroke="#60a5fa" stroke-width="2"/>
  <text x="110" y="308" fill="white" font-size="11" font-weight="600">axum HTTP 服务 —— 127.0.0.1:17890</text>
  <text x="810" y="308" fill="#60a5fa" font-size="9" font-weight="600" text-anchor="end">HTTP 视图</text>

  <!-- REST 芯片 -->
  <rect x="106" y="316" width="350" height="64" rx="6" fill="#0f172a"/>
  <rect x="106" y="316" width="350" height="64" rx="6" fill="rgba(59,130,246,0.25)" stroke="#60a5fa" stroke-width="1"/>
  <text x="281" y="340" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">REST /api/v1/*</text>
  <text x="281" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">GUI 与 CLI 共用 · 37 端点</text>
  <text x="281" y="370" fill="#94a3b8" font-size="8" text-anchor="middle">统一错误契约 {error:{code,message}}</text>

  <!-- MCP 芯片 -->
  <rect x="472" y="316" width="342" height="64" rx="6" fill="#0f172a"/>
  <rect x="472" y="316" width="342" height="64" rx="6" fill="rgba(59,130,246,0.25)" stroke="#60a5fa" stroke-width="1"/>
  <text x="643" y="340" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">MCP /mcp · Streamable HTTP</text>
  <text x="643" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">24 tools · rmcp</text>
  <text x="643" y="370" fill="#94a3b8" font-size="8" text-anchor="middle">isError 透传 {code,message,status}</text>

  <!-- GUI Webview（应用内第 3 门面） -->
  <rect x="880" y="286" width="296" height="84" rx="6" fill="#0f172a"/>
  <rect x="880" y="286" width="296" height="84" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1028" y="308" fill="white" font-size="11" font-weight="600" text-anchor="middle">GUI Webview（React）</text>
  <text x="1028" y="325" fill="#94a3b8" font-size="9" text-anchor="middle">src/ 页面 · zustand · 轮询 + 事件</text>
  <text x="1028" y="341" fill="#94a3b8" font-size="8" text-anchor="middle">+ Tauri IPC 壳：窗口 / 托盘 / 事件</text>
  <text x="1028" y="357" fill="#64748b" font-size="8" text-anchor="middle">（无业务，业务全在服务层）</text>

  <!-- 连线：CLI → REST -->
  <path d="M 236,200 L 236,246 L 281,246 L 281,286" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="296" y="280" fill="#60a5fa" font-size="8">HTTP /api/v1/*</text>

  <!-- 连线：MCP 客户端 → MCP -->
  <path d="M 600,200 L 600,246 L 643,246 L 643,286" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="658" y="280" fill="#60a5fa" font-size="8">MCP /mcp</text>

  <!-- 连线：GUI → REST -->
  <path d="M 880,341 L 830,341" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="855" y="333" fill="#60a5fa" font-size="7.5" text-anchor="middle">fetch /api/v1</text>

  <!-- 连线：axum → 服务层 -->
  <path d="M 460,396 L 460,470" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="472" y="437" fill="#34d399" font-size="8.5">薄壳：零业务逻辑</text>

  <!-- ══════════ 服务层（唯一业务事实源） ══════════ -->
  <rect x="90" y="470" width="1086" height="136" rx="10" fill="#0f172a"/>
  <rect x="90" y="470" width="1086" height="136" rx="10" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="110" y="492" fill="white" font-size="11.5" font-weight="600">application/ 应用服务层 —— 唯一业务事实源（GUI / MCP / CLI 共享）</text>
  <text x="1156" y="492" fill="#34d399" font-size="9" font-weight="600" text-anchor="end">业务只此一份</text>

  <rect x="106" y="504" width="198" height="52" rx="6" fill="#0f172a"/>
  <rect x="106" y="504" width="198" height="52" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1"/>
  <text x="205" y="526" fill="white" font-size="10" font-weight="600" text-anchor="middle">EnvironmentService</text>
  <text x="205" y="542" fill="#94a3b8" font-size="8" text-anchor="middle">环境 · hosts 配置源</text>

  <rect x="312" y="504" width="198" height="52" rx="6" fill="#0f172a"/>
  <rect x="312" y="504" width="198" height="52" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1"/>
  <text x="411" y="526" fill="white" font-size="10" font-weight="600" text-anchor="middle">InstanceService</text>
  <text x="411" y="542" fill="#94a3b8" font-size="8" text-anchor="middle">实例 · 生命周期 · CDP</text>

  <rect x="518" y="504" width="198" height="52" rx="6" fill="#0f172a"/>
  <rect x="518" y="504" width="198" height="52" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1"/>
  <text x="617" y="526" fill="white" font-size="10" font-weight="600" text-anchor="middle">ExtensionService</text>
  <text x="617" y="542" fill="#94a3b8" font-size="8" text-anchor="middle">扩展 · 注册表 · 运行时解析</text>

  <rect x="724" y="504" width="198" height="52" rx="6" fill="#0f172a"/>
  <rect x="724" y="504" width="198" height="52" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1"/>
  <text x="823" y="526" fill="white" font-size="10" font-weight="600" text-anchor="middle">ProfileService</text>
  <text x="823" y="542" fill="#94a3b8" font-size="8" text-anchor="middle">登录态快照 · 克隆</text>

  <rect x="930" y="504" width="198" height="52" rx="6" fill="#0f172a"/>
  <rect x="930" y="504" width="198" height="52" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1"/>
  <text x="1029" y="526" fill="white" font-size="10" font-weight="600" text-anchor="middle">SettingsService</text>
  <text x="1029" y="542" fill="#94a3b8" font-size="8" text-anchor="middle">应用设置</text>

  <text x="110" y="584" fill="#6ee7b7" font-size="8.5">Activity 审计 · Reconciler 对账（状态以真实进程为准）· KeepAlive 崩溃自愈 · PortAllocator 端口分配</text>

  <!-- 连线：服务层 → 基础设施 -->
  <path d="M 633,606 L 633,648" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="645" y="632" fill="#34d399" font-size="8.5">仓储 · 进程 · 探活</text>

  <!-- ══════════ 基础设施层 ══════════ -->
  <rect x="106" y="648" width="198" height="72" rx="6" fill="#0f172a"/>
  <rect x="106" y="648" width="198" height="72" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="205" y="672" fill="white" font-size="10" font-weight="600" text-anchor="middle">SQLite manager.db</text>
  <text x="205" y="688" fill="#94a3b8" font-size="8" text-anchor="middle">r2d2 池 · 环境/实例/扩展/设置</text>
  <text x="205" y="702" fill="#94a3b8" font-size="8" text-anchor="middle">（配置 + 最近状态，非事实源）</text>

  <rect x="312" y="648" width="198" height="72" rx="6" fill="#0f172a"/>
  <rect x="312" y="648" width="198" height="72" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="411" y="672" fill="white" font-size="10" font-weight="600" text-anchor="middle">KernelManager</text>
  <text x="411" y="688" fill="#94a3b8" font-size="8" text-anchor="middle">Chrome for Testing</text>
  <text x="411" y="702" fill="#94a3b8" font-size="8" text-anchor="middle">pinned 131 · 双镜像下载</text>

  <rect x="518" y="648" width="198" height="72" rx="6" fill="#0f172a"/>
  <rect x="518" y="648" width="198" height="72" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="617" y="672" fill="white" font-size="10" font-weight="600" text-anchor="middle">ProcessManager</text>
  <text x="617" y="688" fill="#94a3b8" font-size="8" text-anchor="middle">PortAllocator · spawn</text>
  <text x="617" y="702" fill="#94a3b8" font-size="8" text-anchor="middle">探活 · 优雅终止 · reaper</text>

  <rect x="724" y="648" width="198" height="72" rx="6" fill="#0f172a"/>
  <rect x="724" y="648" width="198" height="72" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="823" y="672" fill="white" font-size="10" font-weight="600" text-anchor="middle">CDP Client</text>
  <text x="823" y="688" fill="white" font-size="8" text-anchor="middle">HTTP + WebSocket</text>
  <text x="823" y="702" fill="#94a3b8" font-size="8" text-anchor="middle">标签页 · 导航 · 激活</text>

  <rect x="930" y="648" width="198" height="72" rx="6" fill="#0f172a"/>
  <rect x="930" y="648" width="198" height="72" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1029" y="672" fill="white" font-size="10" font-weight="600" text-anchor="middle">Hosts Resolver</text>
  <text x="1029" y="688" fill="#94a3b8" font-size="8" text-anchor="middle">拉取配置源 · 解析合并</text>
  <text x="1029" y="702" fill="#94a3b8" font-size="8" text-anchor="middle">进程级 hosts 注入</text>

  <!-- 连线：基础设施 → Chrome 总线 -->
  <path d="M 617,720 L 617,760" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <path d="M 823,720 L 823,760" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <line x1="270" y1="760" x2="990" y2="760" stroke="#fb923c" stroke-width="3" stroke-opacity="0.7"/>
  <path d="M 270,760 L 270,800" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M 630,760 L 630,800" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M 990,760 L 990,800" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="700" y="752" fill="#fb923c" font-size="8.5">spawn · 探活对账 · CDP 自动化</text>

  <!-- ══════════ Chrome for Testing 子进程（应用之外） ══════════ -->
  <text x="100" y="792" fill="#fbbf24" font-size="8.5" font-weight="600">Chrome for Testing 子进程（应用之外 · 可存活于应用重启，重启后对账 reattach）</text>

  <rect x="100" y="800" width="340" height="70" rx="6" fill="#0f172a"/>
  <rect x="100" y="800" width="340" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="270" y="824" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">Chrome for Testing — ins_a</text>
  <text x="270" y="841" fill="#94a3b8" font-size="8" text-anchor="middle">独立 profile 目录 · hosts 注入 · 登录态克隆</text>
  <text x="270" y="856" fill="#94a3b8" font-size="8" text-anchor="middle">CDP 127.0.0.1:9333</text>

  <rect x="460" y="800" width="340" height="70" rx="6" fill="#0f172a"/>
  <rect x="460" y="800" width="340" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="630" y="824" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">Chrome for Testing — ins_b</text>
  <text x="630" y="841" fill="#94a3b8" font-size="8" text-anchor="middle">独立 profile 目录 · hosts 注入 · 登录态克隆</text>
  <text x="630" y="856" fill="#94a3b8" font-size="8" text-anchor="middle">CDP 127.0.0.1:9334</text>

  <rect x="820" y="800" width="340" height="70" rx="6" fill="#0f172a"/>
  <rect x="820" y="800" width="340" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="990" y="824" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">Chrome for Testing — ins_N …</text>
  <text x="990" y="841" fill="#94a3b8" font-size="8" text-anchor="middle">每实例独立用户目录，互不污染</text>
  <text x="990" y="856" fill="#94a3b8" font-size="8" text-anchor="middle">GUI / MCP / CLI 操作的是同一批实例</text>

  <!-- ══════════ 关键结论 Callout ══════════ -->
  <rect x="90" y="906" width="1086" height="64" rx="8" fill="#0f172a"/>
  <rect x="90" y="906" width="1086" height="64" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="633" y="932" fill="white" font-size="11" font-weight="600" text-anchor="middle">★ Agent API（REST /api/v1）＝ 服务层的 HTTP 视图 · MCP（/mcp）＝ 同一层的工具视图 · CLI ＝ 同一层的命令视图</text>
  <text x="633" y="952" fill="#94a3b8" font-size="9" text-anchor="middle">业务逻辑只有一份（application/）；三种视图仅是协议适配，行为与错误契约 {error:{code,message}} 完全一致 —— 这就是「三个门面共享同一套服务层」</text>

  <!-- ══════════ 图例 ══════════ -->
  <circle cx="104" cy="1008" r="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="114" y="1012" fill="#94a3b8" font-size="8.5">门面 / 客户端</text>
  <circle cx="264" cy="1008" r="4" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="274" y="1012" fill="#94a3b8" font-size="8.5">协议视图（HTTP / MCP）</text>
  <circle cx="484" cy="1008" r="4" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="494" y="1012" fill="#94a3b8" font-size="8.5">服务层（唯一业务）</text>
  <circle cx="680" cy="1008" r="4" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="1012" fill="#94a3b8" font-size="8.5">基础设施</text>
  <circle cx="820" cy="1008" r="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="830" y="1012" fill="#94a3b8" font-size="8.5">存储</text>
  <circle cx="920" cy="1008" r="4" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="930" y="1012" fill="#94a3b8" font-size="8.5">Chrome 子进程 / 外部</text>
</svg>
